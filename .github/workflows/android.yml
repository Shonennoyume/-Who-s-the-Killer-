
name: WHO'S THE KILLER? - Build 0.4.0

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          MANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$MANAGER" ]; then
            echo "sdkmanager was not found."
            exit 1
          fi

          echo "SDK_MANAGER=$MANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          yes | "$SDK_MANAGER" --licenses || true
          "$SDK_MANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source files
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/whosthekiller/game/MainActivity.java

      - name: Build game
        run: gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload game APK
        uses: actions/upload-artifact@v4
        with:
          name: WhosTheKiller-v0.4.0
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
